<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>ئەرکی ماڵەوە</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      background-color: #ffffff;
      min-height: 100vh;
      width: 100vw;
      padding: 0;
      margin: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .label {
      display: flex;
      align-items: center;
      direction: rtl;
      color: white;
      background-color: #910D2A;
      border-bottom: 0.2vw solid black;
      height: 14vw;
      padding: 0;
      margin: 0;
      width: 100vw;
    }

    h1 {
      font-size: 3.5vw;
      margin: 0;
      padding: 0;
    }

    .logo1 {
      height: 9vw;
      width: 9vw;
      margin: 0 2vw 0 2vw;
    }

    .sub-label {
      font-size: 2.5vw;
      margin: 0;
      padding: 0;
    }

    .main-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100vw;
      padding-top: 5vw;
      padding-bottom: 20vw;
      background-color: #ffffff;
    }

    .assignments-container {
      width: 90vw;
      display: flex;
      flex-direction: column;
      gap: 3vw;
    }

    .page-title {
      font-size: 4.5vw;
      font-weight: 700;
      color: #bf0029;
      text-align: center;
      margin-bottom: 2vw;
      border-bottom: 0.3vw solid #bf0029;
      padding-bottom: 1.5vw;
    }

    .assignment-card {
      background-color: #ffffff;
      border: 0.2vw solid #bf0029;
      border-radius: 1vw;
      box-shadow: 0 0 2vw rgba(0, 0, 0, 0.15);
      overflow: hidden;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .assignment-card:hover {
      box-shadow: 0 0 2.5vw rgba(191, 0, 41, 0.25);
    }

    .assignment-header {
      padding: 3vw;
      display: flex;
      align-items: center;
      gap: 3vw;
      cursor: pointer;
      user-select: none;
      background-color: #ffffff;
    }

    .custom-checkbox {
      width: 5vw;
      height: 5vw;
      accent-color: #bf0029;
      cursor: pointer;
    }

    .assignment-meta {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      gap: 0.5vw;
    }

    .subject-tag {
      font-size: 2.5vw;
      font-weight: 700;
      color: #910D2A;
      text-transform: uppercase;
    }

    .assignment-title {
      font-size: 3.5vw;
      font-weight: 600;
      color: #000000;
      transition: color 0.2s ease;
    }

    .completed-text {
      text-decoration: line-through;
      opacity: 0.4;
    }

    .due-date {
      font-size: 2.5vw;
      color: #555555;
      font-weight: 500;
      white-space: nowrap;
    }

    .expand-icon {
      font-size: 3vw;
      color: #bf0029;
      transition: transform 0.3s ease;
    }

    .assignment-card.expanded .expand-icon {
      transform: rotate(180deg);
    }

    .assignment-body {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.35s ease-out, padding 0.35s ease;
      background-color: #fcf8f8;
      padding: 0 3vw;
      border-top: 0.1vw solid transparent;
    }

    .assignment-card.expanded .assignment-body {
      max-height: 100vw;
      padding: 3vw;
      border-top-color: #e5e5e5;
    }

    .assignment-description {
      font-size: 3vw;
      line-height: 1.6;
      color: #333333;
      margin-bottom: 2vw;
      white-space: pre-line;
    }

    .instructor-info {
      font-size: 2.5vw;
      color: #666666;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      font-weight: 500;
    }

    .empty-state {
      text-align: center;
      color: #777777;
      padding: 8vw;
      font-size: 3.5vw;
      font-weight: 600;
      border: 0.2vw dashed #cccccc;
      border-radius: 1vw;
    }

    /* Bottom Navigation Dock Styling */
    .app-bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100vw;
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border-top: 0.2vw solid rgba(145, 13, 42, 0.2);
      display: flex;
      justify-content: space-around;
      align-items: center;
      padding: 2.5vw 5vw;
      z-index: 1000;
      box-shadow: 0 -0.5vw 2vw rgba(0, 0, 0, 0.08);
    }

    .nav-btn {
      background-color: #910D2A;
      color: white;
      border: none;
      border-radius: 1.5vw;
      padding: 2vw 5vw;
      font-size: 3.2vw;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 1.5vw;
      cursor: pointer;
      box-shadow: 0 0.5vw 1vw rgba(145, 13, 42, 0.2);
      transition: background-color 0.2s ease, transform 0.1s ease;
      font-family: inherit;
    }

    .nav-btn:active {
      transform: scale(0.95);
    }

    .nav-btn:hover {
      background-color: #bf0029;
    }
  </style>
</head>
<body>

  <div class="label">
    <img src="logo.png" class="logo1" alt="Logo">
    <div class="main-label">
      <h1>زانکۆی سەلاحەدین-هەولێر</h1>
      <p class="sub-label">پەروەردەی ماتماتیک / قۆناغی یەکەم</p>
    </div>
  </div>

  <div class="main-screen">
    <div class="assignments-container">
      <div class="page-title">ئەرکی ماڵەوە (Assignments)</div>
      <div id="assignmentsList" class="empty-state">چاوەڕوان بە...</div>
    </div>
  </div>

  <!-- Bottom Navigation Bar (Refresh & Back swapped) -->
  <div class="app-bottom-nav">
    <button class="nav-btn" onclick="window.location.reload();">
      <span>↻</span> نوێکردنەوە
    </button>
    <button class="nav-btn" onclick="if (document.referrer) { window.location.href = document.referrer; } else { window.history.back(); }">
      <span>←</span> گەڕانەوە
    </button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-YOUR_ACTUAL_API_KEY",
        authDomain: "cognito-f1f7b.firebaseapp.com",
        databaseURL: "https://cognito-f1f7b-default-rtdb.firebaseio.com/",
        projectId: "cognito-f1f7b",
        storageBucket: "cognito-f1f7b.firebasestorage.app",
        messagingSenderId: "506661532829",
        appId: "1:506661532829:web:7a28aa874ba80871691074"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    function isExpired(expiryDateStr) {
        if (expiryDateStr === 'time' || !expiryDateStr) {
            return false;
        }
        const expiryThreshold = new Date(`${expiryDateStr}T08:30:00`);
        const now = new Date();
        return now > expiryThreshold;
    }

    const assignmentsRef = ref(db, 'Salahaddin-University/Mathematics-Dipartment/A1');
    
    onValue(assignmentsRef, (snapshot) => {
        const assignmentsList = document.getElementById('assignmentsList');
        assignmentsList.innerHTML = '';

        if (!snapshot.exists()) {
            assignmentsList.innerHTML = '<div class="empty-state">هیچ ئەرکێکی ماڵەوە بەردەست نییە!</div>';
            return;
        }

        const data = snapshot.val();
        
        const assignmentsArray = Object.keys(data).map(key => {
            return { id: key, ...data[key] };
        });

        const activeAssignments = assignmentsArray.filter(item => !isExpired(item.expiryDate));

        if (activeAssignments.length === 0) {
            assignmentsList.innerHTML = '<div class="empty-state">هیچ ئەرکێکی دیاریکراو نییە، هەمووی تەواو کراوە!</div>';
            return;
        }

        activeAssignments.sort((a, b) => {
            if (a.expiryDate === 'time') return -1;
            if (b.expiryDate === 'time') return 1;
            const dateA = new Date(`${a.expiryDate}T08:30:00`);
            const dateB = new Date(`${b.expiryDate}T08:30:00`);
            return dateA - dateB;
        });

        activeAssignments.forEach(assignment => {
            const card = document.createElement('div');
            card.className = 'assignment-card';

            const isChecked = localStorage.getItem(`completed_${assignment.id}`) === 'true';

            const displayDueDate = (assignment.expiryDate === 'time' || !assignment.expiryDate) 
                ? 'وانەیەکیتر' 
                : assignment.expiryDate;

            card.innerHTML = `
                <div class="assignment-header">
                    <input type="checkbox" class="custom-checkbox" ${isChecked ? 'checked' : ''}>
                    <div class="assignment-meta">
                        <div class="subject-tag">${assignment.subject}</div>
                        <div class="assignment-title ${isChecked ? 'completed-text' : ''}">${assignment.title}</div>
                    </div>
                    <div class="due-date">بەروار: ${displayDueDate}</div>
                    <div class="expand-icon">▼</div>
                </div>
                <div class="assignment-body">
                    <div class="assignment-description">${assignment.description}</div>
                    <div class="instructor-info">📌 ${assignment.instructor}</div>
                </div>
            `;

            const header = card.querySelector('.assignment-header');
            header.addEventListener('click', (e) => {
                if (e.target.classList.contains('custom-checkbox')) return;
                card.classList.toggle('expanded');
            });

            const checkbox = card.querySelector('.custom-checkbox');
            const titleEl = card.querySelector('.assignment-title');
            
            checkbox.addEventListener('change', (e) => {
                const checked = e.target.checked;
                localStorage.setItem(`completed_${assignment.id}`, checked);
                
                if (checked) {
                    titleEl.classList.add('completed-text');
                } else {
                    titleEl.classList.remove('completed-text');
                }
            });

            assignmentsList.appendChild(card);
        });
    });
  </script>

</body>
</html>
