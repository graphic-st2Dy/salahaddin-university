<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Group A - Student List</title>
  <style>
    /* Reset & Base Setup */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #f4f5f7;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
      color: #333;
    }

    /* Paper Sheet Container */
    .paper-container {
      background: #ffffff;
      width: 100%;
      max-width: 800px;
      padding: 60px 50px;
      border-radius: 4px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
      border: 1px solid #e0e0e0;
    }

    /* Header Styling */
    h1 {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 2px solid #222222;
      letter-spacing: 0.5px;
    }

    /* Table Styling */
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
      font-size: 1.1rem;
    }

    th, td {
      padding: 14px 18px;
      text-align: right;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background-color: #f8fafc;
      color: #475569;
      font-weight: 600;
      font-size: 1rem;
      text-transform: uppercase;
      border-top: 1px solid #e2e8f0;
    }

    th.col-num, td.col-num {
      width: 80px;
      text-align: center;
    }

    tr:hover {
      background-color: #f8fafc;
    }

    /* Loading & Status States */
    .status-msg {
      text-align: center;
      font-size: 1.1rem;
      color: #64748b;
      padding: 30px 0;
    }

    /* Print Styling for clean export */
    @media print {
      body {
        background-color: #ffffff;
        padding: 0;
      }
      .paper-container {
        box-shadow: none;
        border: none;
        padding: 0;
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <div class="paper-container">
    <h1>Group A</h1>

    <div id="status" class="status-msg">جارٍ تحميل البيانات...</div>

    <table id="namesTable" style="display: none;">
      <thead>
        <tr>
          <th class="col-num">#</th>
          <th>الاسم</th>
        </tr>
      </thead>
      <tbody id="tableBody">
        <!-- Rows will be injected here dynamically -->
      </tbody>
    </table>
  </div>

  <!-- Firebase Modular SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Your Firebase Configuration
    const firebaseConfig = {
      apiKey: "AIzaSyB-YOUR_ACTUAL_API_KEY",
      authDomain: "cognito-f1f7b.firebaseapp.com",
      databaseURL: "https://cognito-f1f7b-default-rtdb.firebaseio.com/",
      projectId: "cognito-f1f7b",
      storageBucket: "cognito-f1f7b.firebasestorage.app",
      messagingSenderId: "506661532829",
      appId: "1:506661532829:web:7a28aa874ba80871691074"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tableBody = document.getElementById('tableBody');
    const namesTable = document.getElementById('namesTable');
    const statusMsg = document.getElementById('status');

    // Reference to the submissions node in database
    const submissionsRef = ref(db, 'submissions');

    // Real-time listener for database entries
    onValue(submissionsRef, (snapshot) => {
      const data = snapshot.val();

      if (!data) {
        statusMsg.textContent = "لا توجد أسماء مسجلة حتى الآن.";
        statusMsg.style.display = 'block';
        namesTable.style.display = 'none';
        return;
      }

      // Extract only the names from the objects, ignoring timestamp & userAgent
      const namesList = [];
      Object.values(data).forEach(entry => {
        if (entry && entry.name) {
          namesList.push(entry.name.trim());
        }
      });

      if (namesList.length === 0) {
        statusMsg.textContent = "لا توجد أسماء مسجلة حتى الآن.";
        statusMsg.style.display = 'block';
        namesTable.style.display = 'none';
        return;
      }

      // Sort names in Arabic Alphabetical Order
      namesList.sort((a, b) => a.localeCompare(b, 'ar', { sensitivity: 'base' }));

      // Clear existing content
      tableBody.innerHTML = '';

      // Populate table rows
      namesList.forEach((name, index) => {
        const row = document.createElement('tr');
        
        const cellNum = document.createElement('td');
        cellNum.className = 'col-num';
        cellNum.textContent = index + 1;

        const cellName = document.createElement('td');
        cellName.textContent = name;

        row.appendChild(cellNum);
        row.appendChild(cellName);
        tableBody.appendChild(row);
      });

      // Show table and hide status message
      statusMsg.style.display = 'none';
      namesTable.style.display = 'table';
    }, (error) => {
      console.error("Error fetching data: ", error);
      statusMsg.textContent = "حدث خطأ أثناء تحميل البيانات.";
    });
  </script>

</body>
</html>
