<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LIBRARY LINK</title>
  <!-- Load Google Font 'Inter' with bold/extrabold weights for crisp geometric typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Load Tailwind CSS for clean utility styling -->
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Base typography and smooth rendering */
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      /* Deep navy-indigo outer backdrop matching the icon's outer canvas */
      background-color: #192567;
      background-image: radial-gradient(circle at 50% 18%, #263b96 0%, #192567 68%, #131c52 100%);
    }

    /* Custom squircle card styling mirroring the Library Link app icon */
    .icon-card {
      background: linear-gradient(155deg, #2d47a6 0%, #23388b 48%, #1a296e 100%);
      border: 2px solid rgba(147, 197, 253, 0.55);
      box-shadow:
        0 24px 48px -12px rgba(8, 13, 44, 0.72),
        0 0 0 1px rgba(186, 230, 253, 0.16) inset,
        0 2px 12px rgba(147, 197, 253, 0.18) inset;
    }

    /* Mini app icon badge bevel & glow */
    .icon-badge {
      background: linear-gradient(145deg, #314eb3 0%, #213484 55%, #182666 100%);
      border: 2px solid #8bb8f8;
      box-shadow:
        0 12px 24px -6px rgba(9, 15, 48, 0.65),
        0 0 0 1px rgba(224, 242, 254, 0.25) inset;
    }
  </style>
</head>
<body class="text-white antialiased selection:bg-sky-300 selection:text-indigo-950 min-h-screen py-12 px-4 sm:px-6 lg:px-8">

  <!-- Main Centered Container -->
  <main class="max-w-xl mx-auto">
    
    <!-- Header Section with Custom Inline SVG Logo & LIBRARY LINK Branding -->
    <header class="mb-8 flex flex-col items-center text-center">
      
      <!-- Rounded-Square App Icon Badge (mirrors 28882.jpg) -->
      <div class="icon-badge w-20 h-20 sm:w-24 sm:h-24 rounded-3xl flex items-center justify-center mb-5 transition-transform duration-200 hover:scale-105">
        <svg viewBox="0 0 120 120" class="w-16 h-16 sm:w-20 sm:h-20" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Library Link Icon">
          <defs>
            <!-- Crisp white-to-ice-blue gradient for book pages & chain link -->
            <linearGradient id="pageGrad" x1="20" y1="30" x2="100" y2="90" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" />
              <stop offset="70%" stop-color="#e0f2fe" />
              <stop offset="100%" stop-color="#bae6fd" />
            </linearGradient>
            <linearGradient id="linkGrad" x1="35" y1="80" x2="85" y2="32" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#bae6fd" />
              <stop offset="45%" stop-color="#ffffff" />
              <stop offset="100%" stop-color="#e0f2fe" />
            </linearGradient>
          </defs>

          <!-- Outer Sky-Blue Layered Book Pages (Left & Right) -->
          <path d="M18 46L60 58V92L18 80V46Z" stroke="#60a5fa" stroke-width="3" stroke-linejoin="round" fill="none" />
          <path d="M102 46L60 58V92L102 80V46Z" stroke="#60a5fa" stroke-width="3" stroke-linejoin="round" fill="none" />
          
          <path d="M23 41L60 53V88L23 76V41Z" stroke="#93c5fd" stroke-width="2.5" stroke-linejoin="round" fill="none" />
          <path d="M97 41L60 53V88L97 76V41Z" stroke="#93c5fd" stroke-width="2.5" stroke-linejoin="round" fill="none" />

          <!-- Inner Bright White Open Book Pages -->
          <path d="M28 35L60 47V84L28 72V35Z" fill="url(#pageGrad)" />
          <path d="M92 35L60 47V84L92 72V35Z" fill="url(#pageGrad)" />
          <!-- Center Spine Shadow -->
          <path d="M60 47V84" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />

          <!-- Diagonal Interlocking Chain Link Over the Book -->
          <g transform="rotate(-45 60 60)">
            <!-- Lower-Left Chain Ring -->
            <rect x="30" y="50" width="34" height="20" rx="10" stroke="#1e3a8a" stroke-width="9" />
            <rect x="30" y="50" width="34" height="20" rx="10" stroke="url(#linkGrad)" stroke-width="5.5" />
            <!-- Upper-Right Chain Ring -->
            <rect x="56" y="50" width="34" height="20" rx="10" stroke="#1e3a8a" stroke-width="9" />
            <rect x="56" y="50" width="34" height="20" rx="10" stroke="url(#linkGrad)" stroke-width="5.5" />
          </g>

          <!-- Three Outward Radiating Arrows Bursting Top-Right -->
          <!-- Center Main Dashed Arrow -->
          <line x1="81" y1="39" x2="96" y2="24" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="4 3.5" />
          <path d="M89 23H97V31" stroke="#ffffff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Upper Curved/Angled Arrow -->
          <path d="M74 33C75 27 77 23 81 19" stroke="#bae6fd" stroke-width="2.6" stroke-linecap="round" />
          <path d="M75 19H81.5V25.5" stroke="#bae6fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />

          <!-- Lower Curved/Angled Arrow -->
          <path d="M87 46C93 45 97 43 101 39" stroke="#bae6fd" stroke-width="2.6" stroke-linecap="round" />
          <path d="M94.5 38.5H101V45" stroke="#bae6fd" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
        </svg>
      </div>

      <!-- Bold Uppercase Title Matching Icon Typography -->
      <h1 class="text-3xl sm:text-4xl font-extrabold tracking-wider uppercase text-white drop-shadow-sm">
        LIBRARY LINK
      </h1>
      <p class="mt-2 text-sm sm:text-base font-medium text-sky-200/90">
        Curated book websites &mdash; click any title to launch in a new tab
      </p>
    </header>

    <!-- Squircle Card Wrapper for the Book Websites List -->
    <section class="icon-card rounded-3xl overflow-hidden">
      
      <!-- 
        ====================================================================
        HOW TO ADD MORE BOOK WEBSITES:
        1. Copy one of the <li>...</li> blocks below.
        2. Paste it inside this <ul> list wherever you want it to appear.
        3. Replace the URL inside href="..." with your new website's link.
        4. Replace the visible text between <span> and </span> with the site's title.
        ====================================================================
      -->
      <ul class="divide-y divide-sky-300/15">

       <!-- Link Item karez -->
        <li>
          <a href="https://share.google/5YwuiCkepZbqk23pL" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">OpenStax</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>        
        
        <!-- Link Item 1 -->
        <li>
          <a href="https://www.goodreads.com" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">Goodreads</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

        <!-- Link Item 2 -->
        <li>
          <a href="https://www.gutenberg.org" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">Project Gutenberg</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

        <!-- Link Item 3 -->
        <li>
          <a href="https://openlibrary.org" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">Open Library</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

        <!-- Link Item 4 -->
        <li>
          <a href="https://standardebooks.org" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">Standard Ebooks</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

        <!-- Link Item 5 -->
        <li>
          <a href="https://app.thestorygraph.com" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">The StoryGraph</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

        <!-- Link Item 6 -->
        <li>
          <a href="https://bookshop.org" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">Bookshop.org</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

        <!-- Link Item 7 -->
        <li>
          <a href="https://librivox.org" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">LibriVox (Free Audiobooks)</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

        <!-- Link Item 8 -->
        <li>
          <a href="https://www.worldcat.org" 
             target="_blank" 
             rel="noopener noreferrer"
             class="group flex items-center justify-between px-6 py-4 text-base font-semibold text-white hover:bg-sky-400/15 hover:text-sky-100 transition-all duration-150">
            <span class="tracking-wide">WorldCat</span>
            <span class="text-sky-300/80 font-bold group-hover:text-white group-hover:translate-x-0.5 group-hover:-translate-y-0.5 transition-all duration-150" aria-hidden="true">&#8599;</span>
          </a>
        </li>

      </ul>
    </section>

  </main>

</body>
</html>
