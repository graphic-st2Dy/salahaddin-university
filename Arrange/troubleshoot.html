<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mathematics Department - Submitted Issues</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f3f2f1;
            padding: 32px 20px;
            color: #323130;
        }

        .wrapper {
            max-width: 960px;
            margin: 0 auto;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 16px;
        }

        .card {
            background-color: #ffffff;
            padding: 24px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.12);
            border-radius: 2px;
            border-top: 3px solid #0067b8;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 2px;
            padding-bottom: 10px;
            border-bottom: 1px solid #edebe9;
        }

        .field:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .label {
            font-size: 12px;
            color: #605e5c;
            font-weight: 600;
        }

        .value {
            font-size: 15px;
            color: #323130;
            word-break: break-word;
        }

        .ltr {
            direction: ltr;
            text-align: left;
        }

        .problem-value {
            color: #a4262c;
            font-weight: 600;
        }

        .status {
            text-align: center;
            color: #605e5c;
            font-size: 15px;
            margin-top: 40px;
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div id="status" class="status">...</div>
    <div id="cardsContainer" class="grid"></div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyB-YOUR_ACTUAL_API_KEY",
        authDomain: "cognito-f1f7b.firebaseapp.com",
        databaseURL: "https://cognito-f1f7b-default-rtdb.firebaseio.com/",
        projectId: "cognito-f1f7b",
        storageBucket: "cognito-f1f7b.firebasestorage.app",
        messagingSenderId: "506661532829",
        appId: "1:506661532829:web:7a28aa874ba80871691074"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const issuesRef = ref(db, 'Salahaddin-University/Mathematics-Dipartment/Issue');
    const cardsContainer = document.getElementById('cardsContainer');
    const statusEl = document.getElementById('status');

    function escapeHTML(str) {
        if (!str) return "";
        return String(str)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    onValue(issuesRef, (snapshot) => {
        cardsContainer.innerHTML = "";

        if (!snapshot.exists()) {
            statusEl.style.display = "block";
            statusEl.textContent = "0";
            return;
        }

        statusEl.style.display = "none";
        const data = snapshot.val();
        const records = Object.values(data);

        // Sort newest first
        records.sort((a, b) => new Date(b.timestamp || 0) - new Date(a.timestamp || 0));

        records.forEach((student) => {
            const card = document.createElement('div');
            card.className = 'card';

            card.innerHTML = `
                <div class="field">
                    <span class="label">ناوی سیانی</span>
                    <span class="value">${escapeHTML(student.fullName)}</span>
                </div>
                <div class="field">
                    <span class="label ltr">Year</span>
                    <span class="value ltr">${escapeHTML(student.year)}</span>
                </div>
                <div class="field">
                    <span class="label ltr">Department</span>
                    <span class="value ltr">${escapeHTML(student.department)}</span>
                </div>
                <div class="field">
                    <span class="label">گرووپ</span>
                    <span class="value">${escapeHTML(student.group)}</span>
                </div>
                <div class="field">
                    <span class="label ltr">Email</span>
                    <span class="value ltr">${escapeHTML(student.email)}</span>
                </div>
                <div class="field">
                    <span class="label">جۆری کێشە</span>
                    <span class="value problem-value">${escapeHTML(student.problem)}</span>
                </div>
            `;

            cardsContainer.appendChild(card);
        });
    }, (error) => {
        statusEl.style.display = "block";
        statusEl.textContent = "Error";
    });
</script>

</body>
</html>
